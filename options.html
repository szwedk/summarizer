<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page Summarizer options</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <label for="key">OpenAI API key</label>
    <input id="key" type="password" placeholder="sk-…" spellcheck="false" />
    <p class="hint">Stored with <code>chrome.storage.local</code> on this machine and sent only to api.openai.com.</p>

    <button id="save">Save</button>
    <p id="status" class="status hidden"></p>

    <script src="options.js"></script>
  </body>
</html>
